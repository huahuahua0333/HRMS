{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 企业员工管理系统</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-page">
    <div class="login-box">
        <div class="login-header">
            <h2>企业员工管理系统</h2>
            <p>HR Management System</p>
        </div>
        <div class="login-body">
            <form method="post" class="form-modern">
                {% csrf_token %}
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <div class="form-group">
                    <label>验证码</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" name="code" class="form-control" placeholder="验证码" required style="flex: 1;">
                        <img src="/image/code/" onclick="this.src='/image/code/?'+Math.random()"
                             style="height: 42px; cursor: pointer; border-radius: 6px;" title="点击刷新">
                    </div>
                </div>
                {% if error %}
                <div style="color: #FA5252; margin-bottom: 15px; padding: 10px; background: #FFF5F5; border-radius: 6px; font-size: 14px;">
                    <span class="glyphicon glyphicon-exclamation-sign"></span> {{ error }}
                </div>
                {% endif %}
                <button type="submit" class="login-btn">登 录</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
